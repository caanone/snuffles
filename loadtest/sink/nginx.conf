# snuffles load-test sink: nginx config (loadtest/sink/nginx.conf).
# Installed as /etc/nginx/nginx.conf in the snuffles-sink image.
# Serves /  (small page), /big (100 MiB random file), /status (stub_status).

user www-data;
worker_processes 2;
worker_rlimit_nofile 1048576;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # wrk with keep-alive should never be closed by nginx itself
    keepalive_timeout 300;
    keepalive_requests 1000000;
    reset_timedout_connection on;
    server_tokens off;

    # keep /big and index.html open across requests
    open_file_cache max=64 inactive=1d;
    open_file_cache_valid 1d;
    open_file_cache_min_uses 1;

    server {
        listen 80 default_server backlog=65535 reuseport;
        server_name _;
        root /var/www/sink;

        location = / {
            index index.html;
        }

        location = /big {
            # /var/www/sink/big (100 MiB of /dev/urandom, generated at image build)
            default_type application/octet-stream;
        }

        location = /status {
            stub_status;
        }

        location / {
            try_files $uri =404;
        }
    }
}
