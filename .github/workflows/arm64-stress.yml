# TEMPORARY — branch fix/mp-ring-arm64 only.
#
# The multi-producer ring's memory-ordering defect reproduces on arm64
# and nowhere else, and only in a few rounds out of thirty, so the
# evidence has to come from a high-repetition run on the real hardware.
# This job is the same stress loop as ci.yml's, at a much higher RUNS and
# with the failing round's output shown instead of suppressed.
#
# Deleted again before the branch is merged.
name: arm64 stress (temporary)

on:
  push:
    branches: [fix/mp-ring-arm64]
  workflow_dispatch:
    inputs:
      runs:
        description: rounds
        required: false
        default: "120"

jobs:
  stress:
    name: Linux arm64 stress
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Runner
        run: nproc && cc --version | head -1 && uname -m
      - name: Build
        run: make build/tests/test_ringbuf build/tests/test_session
      - name: Stress
        run: |
          RUNS=${{ github.event.inputs.runs || '120' }}
          fail=0
          for i in $(seq 1 "$RUNS"); do
            for t in test_ringbuf test_session; do
              if ! out=$(build/tests/$t 2>&1); then
                fail=$((fail+1))
                echo "=== round $i: $t ==="
                echo "$out" | grep -a FAIL || true
                echo "$out" | tail -5
              fi
            done
          done
          echo "stress: $RUNS rounds, $fail failure(s)"
          [ "$fail" -eq 0 ]
