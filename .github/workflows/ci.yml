name: CI

on:
  push:
  pull_request:

jobs:
  linux-make:
    name: Linux make ${{ matrix.variant }} (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        variant: [all, nopcap]
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        if: matrix.variant == 'all'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build
        run: make ${{ matrix.variant }} CC=${{ matrix.cc }}
      - name: Smoke test
        run: ./snuffles -v && ./snuffles --list-ifaces
      - name: Unit tests
        run: make test CC=${{ matrix.cc }}

  linux-cmake:
    name: Linux CMake ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [pcap, nopcap]
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        if: matrix.variant == 'pcap'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Configure
        run: cmake -B build-ci ${{ matrix.variant == 'nopcap' && '-DNO_PCAP=ON' || '' }}
      - name: Build
        run: cmake --build build-ci -j
      - name: Smoke test
        run: ./build-ci/snuffles -v
      - name: Unit tests
        run: ctest --test-dir build-ci --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: make debug
      - run: ./snuffles -v && ./snuffles --list-ifaces
      - name: Generate test capture
        run: |
          python3 - <<'EOF'
          import struct
          def eth(p): return bytes(12)+b'\x08\x00'+p
          def ip4(p,pr): return struct.pack('>BBHHHBBH4s4s',0x45,0,20+len(p),1,0,64,pr,0,bytes([10,0,0,1]),bytes([8,8,8,8]))+p
          tcp=struct.pack('>HHIIBBHHH',40000,443,1,0,5<<4,2,65535,0,0)
          pkts=[eth(ip4(tcp,6))]*25
          out=struct.pack('<IHHiIII',0xa1b2c3d4,2,4,0,0,65535,1)
          for i,p in enumerate(pkts): out+=struct.pack('<IIII',1700000000+i,0,len(p),len(p))+p
          open('ci.pcap','wb').write(out)
          EOF
      - name: JSON Lines end-to-end
        run: |
          timeout 30 ./snuffles -r ci.pcap --jsonl | python3 -c "
          import json,sys
          lines=[json.loads(l) for l in sys.stdin]
          assert len(lines)==25 and lines[0]['protocol']=='TCP', lines[:1]
          print('jsonl ok:', len(lines), 'lines')"
      - name: Streaming -w end-to-end
        run: |
          timeout 30 ./snuffles -r ci.pcap --no-ui -w stream.pcap >/dev/null
          python3 -c "
          import struct
          d=open('stream.pcap','rb').read()
          h=struct.unpack('<IHHiIII',d[:24]); assert h[0]==0xa1b2c3d4 and h[6]==1
          n,off=0,24
          while off<len(d):
              inc=struct.unpack('<I',d[off+8:off+12])[0]; off+=16+inc; n+=1
          assert n==25, n
          print('stream pcap ok:', n, 'records')"
      # last: this rebuilds under sanitizers and would clobber ./snuffles
      - name: Unit tests (sanitized)
        run: make clean && make test SAN=1

  macos:
    name: macOS arm64 (libpcap)
    runs-on: macos-latest        # Apple Silicon: weakly-ordered memory model
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: ./snuffles -v && ./snuffles --list-ifaces
      - name: Unit tests
        run: make test
      - name: Unit tests (sanitized)
        run: make clean && make test SAN=1
      - name: Concurrency stress
        run: make clean && make test-stress RUNS=30
      - name: CMake + CTest
        run: |
          cmake -B build-ci -DNO_PCAP=ON
          cmake --build build-ci -j
          ctest --test-dir build-ci --output-on-failure

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm    # second weakly-ordered platform
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: make
      - run: ./snuffles -v && ./snuffles --list-ifaces
      - name: Unit tests
        run: make test
      - name: Unit tests (sanitized)
        run: make clean && make test SAN=1
      - name: Concurrency stress
        run: make clean && make test-stress RUNS=30

  sanitized-tests:
    name: Unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build-san -DNO_PCAP=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-san -j
      - run: ctest --test-dir build-san --output-on-failure

  fuzz-smoke:
    name: Fuzz smoke (libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzzers
        run: |
          clang -std=c11 -g -O1 -fsanitize=fuzzer,address,undefined \
            -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -Iinclude -Isrc \
            fuzz/fuzz_dissect.c src/dissect.c -o fuzz_dissect
          clang -std=c11 -g -O1 -fsanitize=fuzzer,address,undefined \
            -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE -Iinclude -Isrc \
            fuzz/fuzz_filter.c src/filter.c -o fuzz_filter
      - name: Fuzz dissectors
        run: ./fuzz_dissect -runs=200000 -max_len=1500 -print_final_stats=1
      - name: Fuzz filter compiler
        run: ./fuzz_filter -runs=100000 -max_len=256 -print_final_stats=1

  windows-wine:
    name: Windows tests (MinGW + Wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW and Wine
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine64
      - name: Cross-compile and run tests under Wine
        run: ./scripts/test-windows.sh --inner
